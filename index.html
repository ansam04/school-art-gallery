<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>معرض الفن الافتراضي</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="ui top">
  <div class="titlebox glass"><b>معرض الفن الافتراضي</b><span>لطالبات الصف الثاني متوسط — المدرسة المتوسطة الثامنة بينبع البحر</span></div>
</div>
<div class="hint glass">الحركة: WASD • النظر: الماوس • اختاري أحد مداخل الفصول</div>

<a-scene renderer="antialias:true;colorManagement:true" background="color:#EDE9E2">
<a-assets>
  <img id="museumTitle" src="assets/labels/museum_title.png">
  <img id="class1" src="assets/labels/class_1.png"><img id="class2" src="assets/labels/class_2.png">
  <img id="class3" src="assets/labels/class_3.png"><img id="class4" src="assets/labels/class_4.png">
  <img id="class5" src="assets/labels/class_5.png"><img id="class6" src="assets/labels/class_6.png">
  <img id="class7" src="assets/labels/class_7.png">
</a-assets>

<!-- Modern museum shell -->
<a-entity light="type:ambient;intensity:.78;color:#FFF7EB"></a-entity>
<a-entity light="type:directional;intensity:.5" position="-4 7 4"></a-entity>
<a-plane rotation="-90 0 0" width="34" height="34" color="#D9D4CB"></a-plane>
<a-plane rotation="90 0 0" position="0 6 0" width="34" height="34" color="#FAF8F4"></a-plane>
<a-box position="0 3 -16" width="34" height="6" depth=".2" color="#F8F6F1"></a-box>
<a-box position="-17 3 0" width=".2" height="6" depth="34" color="#F3F0EA"></a-box>
<a-box position="17 3 0" width=".2" height="6" depth="34" color="#F3F0EA"></a-box>
<a-box position="0 3 16" width="34" height="6" depth=".2" color="#F8F6F1"></a-box>

<!-- Main exhibition title -->
<a-plane src="#museumTitle" position="0 4.25 -15.82" width="10.2" height="3.12" material="shader:flat"></a-plane>

<!-- Pedestal / sculptural lobby detail -->
<a-cylinder position="0 .65 -7" radius="1.35" height="1.3" color="#F4F1EC"></a-cylinder>
<a-torus position="0 2 -7" radius="1.25" radius-tubular=".18" rotation="90 0 0" color="#BDB7AE"></a-torus>

<!-- Portals -->
<a-entity id="portals"></a-entity>

<a-entity position="0 0 11">
  <a-camera position="0 1.65 0" wasd-controls="acceleration:32" look-controls>
    <a-cursor raycaster="objects:.portal" geometry="primitive:ring;radiusInner:.006;radiusOuter:.011" material="color:#222;shader:flat" position="0 0 -1"></a-cursor>
  </a-camera>
</a-entity>
</a-scene>

<script src="data.js"></script>
<script>
const portalPositions = [
  {p:"-10 2.2 -15.72", r:"0 0 0"},
  {p:"-5 2.2 -15.72", r:"0 0 0"},
  {p:"5 2.2 -15.72", r:"0 0 0"},
  {p:"10 2.2 -15.72", r:"0 0 0"},
  {p:"-16.72 2.2 -5", r:"0 90 0"},
  {p:"16.72 2.2 -5", r:"0 -90 0"},
  {p:"0 2.2 15.72", r:"0 180 0"}
];
MUSEUM.classes.forEach((c,i)=>{
  const wrap=document.createElement("a-entity");
  wrap.setAttribute("position",portalPositions[i].p);
  wrap.setAttribute("rotation",portalPositions[i].r);

  const frame=document.createElement("a-box");
  frame.setAttribute("width","3.4");frame.setAttribute("height","4.5");frame.setAttribute("depth",".22");
  frame.setAttribute("color","#D4CFC7");
  wrap.appendChild(frame);

  const door=document.createElement("a-box");
  door.classList.add("portal");
  door.setAttribute("width","2.85");door.setAttribute("height","3.85");door.setAttribute("depth",".12");
  door.setAttribute("position","0 -.18 .17");door.setAttribute("color","#252525");
  door.addEventListener("click",()=> location.href=`wing.html?class=${i+1}`);
  wrap.appendChild(door);

  const label=document.createElement("a-plane");
  label.setAttribute("src",`#class${i+1}`);
  label.setAttribute("width","2.75");label.setAttribute("height",".76");
  label.setAttribute("position","0 2.05 .2");label.setAttribute("material","shader:flat");
  wrap.appendChild(label);
  portals.appendChild(wrap);
});
</script>
</body></html>
