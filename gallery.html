<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>قاعة العرض</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="ui top">
 <div class="titlebox glass"><b id="classTitle"></b><span id="roomTitle"></span></div>
 <a class="home glass" id="backWing" href="#">← جناح الفصل</a>
</div>
<div class="hint glass">الحركة: WASD • النظر: الماوس • اضغطي على أي عمل لعرض معلوماته</div>
<div class="ui bottom glass" id="roomNav"></div>
<div class="info glass" id="info">
 <button class="close" id="closeInfo">×</button>
 <h3 id="infoTitle"></h3><p id="infoStudent"></p><p id="infoDesc"></p>
</div>

<a-scene renderer="antialias:true;colorManagement:true" background="color:#ECE8E1">
<a-assets id="assetBox"><img id="placeholder" src="assets/placeholder.jpg"></a-assets>
<a-entity light="type:ambient;intensity:.74;color:#FFF6E9"></a-entity>
<a-entity light="type:directional;intensity:.42" position="-4 7 5"></a-entity>

<!-- large modern gallery -->
<a-plane rotation="-90 0 0" width="26" height="30" color="#D7D2CA"></a-plane>
<a-plane rotation="90 0 0" position="0 6 0" width="26" height="30" color="#FBF9F5"></a-plane>
<a-box position="0 3 -15" width="26" height="6" depth=".18" color="#F8F6F1"></a-box>
<a-box position="-13 3 0" width=".18" height="6" depth="30" color="#F3F0EA"></a-box>
<a-box position="13 3 0" width=".18" height="6" depth="30" color="#F3F0EA"></a-box>
<a-box position="0 3 15" width="26" height="6" depth=".18" color="#F8F6F1"></a-box>

<!-- central benches -->
<a-box position="0 .38 -3.5" width="5.4" height=".76" depth="1.5" color="#BDB7AE"></a-box>
<a-box position="0 .38 4.5" width="5.4" height=".76" depth="1.5" color="#BDB7AE"></a-box>

<a-entity id="artGroup"></a-entity>
<a-entity position="0 0 10">
<a-camera position="0 1.65 0" wasd-controls="acceleration:34" look-controls>
<a-cursor raycaster="objects:.art" geometry="primitive:ring;radiusInner:.006;radiusOuter:.011" material="color:#222;shader:flat" position="0 0 -1"></a-cursor>
</a-camera></a-entity>
</a-scene>

<script src="data.js"></script>
<script>
const q=new URLSearchParams(location.search);
const ci=Math.min(Math.max(parseInt(q.get("class")||"1"),1),7);
const ri=Math.min(Math.max(parseInt(q.get("room")||"1"),1),4);
const room=MUSEUM.rooms[ri-1];
classTitle.textContent=MUSEUM.classes[ci-1].name; roomTitle.textContent=room.name;
backWing.href=`wing.html?class=${ci}`;
MUSEUM.rooms.forEach((r,i)=>{
 const a=document.createElement("a"); a.href=`gallery.html?class=${ci}&room=${i+1}`; a.textContent=r.name;
 if(i===ri-1)a.className="active"; roomNav.appendChild(a);
});

// 20 positions: 5 on each wall
const xs=[-9.6,-4.8,0,4.8,9.6];
const zs=[-10.5,-5.25,0,5.25,10.5];
const spots=[];
xs.forEach(x=>spots.push({p:`${x} 2.75 -14.82`,r:"0 0 0"}));
zs.forEach(z=>spots.push({p:`-12.82 2.75 ${z}`,r:"0 90 0"}));
zs.forEach(z=>spots.push({p:`12.82 2.75 ${z}`,r:"0 -90 0"}));
xs.forEach(x=>spots.push({p:`${x} 2.75 14.82`,r:"0 180 0"}));

function createImageAsset(slot){
 const id=`artAsset${slot}`; const img=document.createElement("img");img.id=id;
 const base=artworkBase(ci,room.slug,slot); const exts=[".jpg",".jpeg",".png",".webp"]; let k=0;
 img.onerror=()=>{k++; if(k<exts.length) img.src=base+exts[k]; else {img.onerror=null;img.src="assets/placeholder.jpg";}};
 img.src=base+exts[0]; assetBox.appendChild(img); return id;
}
for(let slot=1;slot<=20;slot++){
 const id=createImageAsset(slot); const s=spots[slot-1];
 const w=document.createElement("a-entity");w.setAttribute("position",s.p);w.setAttribute("rotation",s.r);
 const frame=document.createElement("a-box");frame.setAttribute("width","3.6");frame.setAttribute("height","2.55");frame.setAttribute("depth",".09");frame.setAttribute("color","#2E2B28");w.appendChild(frame);
 const art=document.createElement("a-plane");art.classList.add("art");art.setAttribute("src",`#${id}`);art.setAttribute("width","3.36");art.setAttribute("height","2.31");art.setAttribute("position","0 0 .055");art.setAttribute("material","shader:flat");
 art.addEventListener("click",()=>showInfo(slot));w.appendChild(art);
 artGroup.appendChild(w);
}
function showInfo(slot){
 infoTitle.textContent=`العمل الفني ${String(slot).padStart(2,"0")}`;
 infoStudent.textContent="اسم الطالبة: يضاف لاحقًا";
 infoDesc.textContent=`${MUSEUM.classes[ci-1].name} — ${room.name}`;
 info.classList.add("show");
}
closeInfo.onclick=()=>info.classList.remove("show");
</script>
</body></html>
